<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="game.css">
    <!-- Faviocn Link> -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/686/686589.png">
    <title>Tic Tac Toe Game</title>
</head>
<body>
    
    <main>
        <header id="header">
            <div class="player player-active" id="xplayerDisplay">X</div>
            <h3 id="titleheader">Choose</h3>
            <div class="player" id="oPlayerDisplay">O</div>
        </header>

        <div id="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>

        <button id="restartBtn">
            Restart
        </button>
    </main>


    <script src="game.js"></script>
</body>
</html>
